<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S K I N G O</title>
  <style>
    body {
      background: #181818;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
      z-index: 0;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-shadow:
        0 0 8px #00ff66,
        0 0 16px #00ff66,
        0 0 32px #00ff66;
    }
    #bingo {
      display: grid;
      grid-template-columns: repeat(5, minmax(60px, 1fr));
      grid-template-rows: repeat(5, minmax(60px, 1fr));
      gap: 8px;
      width: 95vw;
      max-width: 500px;
      aspect-ratio: 1/1;
      margin: 0 auto;
      background: #222;
      border-radius: 16px;
      box-shadow: 0 4px 32px #0008;
      padding: 8px;
    }
    .square {
      background: #292929;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0004;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-align: center;
      padding: 4px;
      min-height: 0;
      min-width: 0;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
      overflow: hidden;
      /* Allow text to shrink */
      line-height: 1.1;
      word-break: normal;
      overflow-wrap: break-word;
    }
    .square .square-text {
      width: 100%;
      display: inline-block;
      font-size: inherit;
      transition: font-size 0.2s;
      line-height: 1.1;
      word-break: normal;
      overflow-wrap: break-word;
      white-space: normal;
    }
    .square.filled {
      background: #333;
      transition: background 0.3s;
    }
    .square .x-mark {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }
    .x-mark svg {
      width: 80%;
      height: 80%;
      stroke: #e74c3c;
      stroke-width: 12;
      stroke-linecap: round;
      opacity: 0.85;
    }
    .square.free {
      background: #fff;
      color: #222;
      font-weight: bold;
      border: 2px solid #e74c3c;
      box-shadow: 0 0 0 3px #e74c3c44;
      padding-left: 2px;
      padding-right: 2px;
      white-space: pre-line;
      word-break: normal;
      overflow-wrap: normal;
    }
    .square.free .square-text {
      font-size: 0.7em;
      letter-spacing: 0.01em;
      line-height: 1.01;
      white-space: pre;
      word-break: keep-all;
      overflow-wrap: normal;
    }
    .square.free.filled {
      background: #fff;
    }
    #bingo-btn {
      margin-top: 2rem;
      padding: 0.8em 2em;
      font-size: 1.2rem;
      border-radius: 8px;
      border: none;
      background: #e74c3c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px #0004;
      transition: background 0.2s;
    }
    #bingo-btn:active {
      background: #c0392b;
    }
    #bingo-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #bingo-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    #bingo-overlay h2 {
      color: #fff;
      font-size: 5vw;
      text-shadow: 0 4px 32px #e74c3c, 0 0 8px #fff;
      margin: 0;
      letter-spacing: 8px;
      font-weight: 900;
      text-align: center;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 999;
      display: block;
    }
    @media (max-width: 600px) {
      #bingo {
        max-width: 98vw;
        gap: 4px;
        padding: 4px;
      }
      .square {
        font-size: 0.95rem;
        padding: 1px;
      }
    }
  </style>
</head>
<body>
  <h1>S K I N G O</h1>
  <div id="bingo"></div>
  <div id="bingo-overlay"><h2>BINGO!</h2></div>
  <canvas id="confetti-canvas"></canvas>
  <script>
    // Try to load the background image
    const bgImg = new window.Image();
    bgImg.onload = function() {
      document.body.style.background =
        "linear-gradient(rgba(24,24,24,0.92), rgba(24,24,24,0.92)), url('../meemeemee.png') center center / cover no-repeat";
    };
    bgImg.onerror = function() {
      document.body.style.background = "#181818";
    };
    bgImg.src = "../meemeemee.png";
  </script>
  <script>
    // Load squares.txt at runtime
    let SQUARES = [];
    function fetchSquaresTxt() {
      return fetch('squares.txt')
        .then(response => {
          if (!response.ok) throw new Error('Failed to load squares.txt');
          return response.text();
        })
        .then(text => {
          // Split by newlines, trim, and filter out empty lines
          return text.split('\n').map(line => line.trim()).filter(Boolean);
        });
    }

    const GRID_SIZE = 5;
    const FREE_TEXT = 'FREE SQUARE';
    const ANIMATION_DURATION = 2500; // ms
    const bingo = document.getElementById('bingo');

    // Helper: shuffle array in-place
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Prepare squares: 24 random, center is free
    function getBingoSquares() {
      const squares = [...SQUARES];
      shuffle(squares);
      const selected = squares.slice(0, GRID_SIZE * GRID_SIZE - 1); // 24
      const grid = [];
      let idx = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (r === 2 && c === 2) {
            grid.push(FREE_TEXT);
          } else {
            grid.push(selected[idx++]);
          }
        }
      }
      return grid;
    }

    // Track marked squares
    let marked = Array(GRID_SIZE * GRID_SIZE).fill(false);
    let squaresEls = [];
    let bingoActive = false;

    function isBingo(marked) {
      // Check rows, columns, diagonals
      for (let r = 0; r < GRID_SIZE; r++) {
        if ([0,1,2,3,4].every(c => marked[r*5+c])) return true;
      }
      for (let c = 0; c < GRID_SIZE; c++) {
        if ([0,1,2,3,4].every(r => marked[r*5+c])) return true;
      }
      // Diagonals
      if ([0,6,12,18,24].every(i => marked[i])) return true;
      if ([4,8,12,16,20].every(i => marked[i])) return true;
      return false;
    }

    function showBingo() {
      document.getElementById('bingo-overlay').classList.add('active');
      startConfetti();
    }
    function hideBingo() {
      document.getElementById('bingo-overlay').classList.remove('active');
      stopConfetti();
    }

    // Confetti animation (simple canvas)
    let confettiTimer = null;
    let confettiParticles = [];
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      confettiParticles = Array.from({length: 180}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        r: 6 + Math.random() * 8,
        d: 2 + Math.random() * 4,
        color: `hsl(${Math.random()*360},90%,60%)`,
        tilt: Math.random() * 10 - 5,
        tiltAngle: 0,
        tiltAngleInc: (Math.random() * 0.07) + 0.03
      }));
      function draw() {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for (const p of confettiParticles) {
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.r, p.r/2, p.tilt, 0, 2*Math.PI);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
      }
      function update() {
        for (const p of confettiParticles) {
          p.y += p.d;
          p.x += Math.sin(p.tilt) * 2;
          p.tilt += p.tiltAngleInc;
          if (p.y > canvas.height) {
            p.x = Math.random() * canvas.width;
            p.y = -10;
          }
        }
      }
      function loop() {
        update();
        draw();
        confettiTimer = requestAnimationFrame(loop);
      }
      loop();
    }
    function stopConfetti() {
      if (confettiTimer) cancelAnimationFrame(confettiTimer);
      confettiTimer = null;
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Helper to fit text in a square by shrinking font size if needed
    function fitTextToSquare(div) {
      const textEl = div.querySelector('.square-text');
      if (!textEl) return;
      let fontSize = parseFloat(window.getComputedStyle(div).fontSize);
      const isMobile = window.innerWidth <= 600;
      const minFontSize = div.classList.contains('free') ? (isMobile ? 0.8 : 1.0) : (isMobile ? 0.75 : 0.8); // em
      textEl.style.fontSize = fontSize + 'px';
      // Only shrink if text actually overflows
      const maxIterations = isMobile ? 8 : 6;
      for (let i = 0; i < maxIterations; i++) {
        const overflows = textEl.scrollHeight > div.clientHeight - 6 || textEl.scrollWidth > div.clientWidth - 6;
        if (overflows && fontSize > minFontSize * 16) {
          fontSize *= 0.9;
          if (fontSize < minFontSize * 16) fontSize = minFontSize * 16;
          textEl.style.fontSize = fontSize + 'px';
        } else if (!overflows) {
          break;
        }
      }
    }

    function animateGridFill(grid) {
      squaresEls = [];
      bingo.innerHTML = '';
      marked = Array(GRID_SIZE * GRID_SIZE).fill(false);
      bingoActive = false;
      hideBingo();
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const div = document.createElement('div');
        div.className = 'square';
        if (i === 12) div.classList.add('free');
        div.dataset.idx = i;
        bingo.appendChild(div);
        squaresEls.push(div);
      }
      // Animation: pop in text in random order
      const order = [...shuffle([...Array(GRID_SIZE * GRID_SIZE).keys()].filter(i => i !== 12)), 12];
      let filled = 0;
      const interval = ANIMATION_DURATION / (GRID_SIZE * GRID_SIZE);
      function fillNext() {
        if (filled >= order.length) return;
        const idx = order[filled];
        const div = squaresEls[idx];
        // Use a span for text to allow scaling
        if (idx === 12) {
          div.innerHTML = `<span class='square-text'>FREE\nSQUARE</span>`;
        } else {
          div.innerHTML = `<span class='square-text'>${grid[idx]}</span>`;
        }
        div.classList.add('filled');
        fitTextToSquare(div);
        filled++;
        if (filled < order.length) {
          setTimeout(fillNext, interval);
        }
      }
      fillNext();
      // Add click handler for X toggle
      bingo.onclick = function(e) {
        if (bingoActive) return;
        const target = e.target.closest('.square');
        if (!target || !target.classList.contains('filled')) return;
        const idx = +target.dataset.idx;
        if (target.querySelector('.x-mark')) {
          target.querySelector('.x-mark').remove();
          marked[idx] = false;
        } else {
          const x = document.createElement('span');
          x.className = 'x-mark';
          x.innerHTML = `<svg viewBox=\"0 0 100 100\"><line x1=\"15\" y1=\"15\" x2=\"85\" y2=\"85\" /><line x1=\"85\" y1=\"15\" x2=\"15\" y2=\"85\" /></svg>`;
          target.appendChild(x);
          marked[idx] = true;
        }
        // Always mark center as filled
        marked[12] = true;
        if (isBingo(marked)) {
          bingoActive = true;
          showBingo();
        }
      };
    }

    // On load
    window.addEventListener('DOMContentLoaded', () => {
      fetchSquaresTxt().then(squares => {
        SQUARES = squares;
        const grid = getBingoSquares();
        animateGridFill(grid);
      }).catch(err => {
        alert('Could not load squares.txt: ' + err.message);
      });
    });
  </script>
</body>
</html>
